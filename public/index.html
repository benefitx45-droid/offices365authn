<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft 365</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: #1a1a2e;
            padding: 50px;
            border-radius: 16px;
            border: 1px solid #0078d4;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 120, 212, 0.1);
        }
        
        .logo { font-size: 60px; margin-bottom: 10px; }
        h1 { 
            color: #0078d4; 
            font-weight: 300;
            font-size: 28px;
        }
        .subtitle { color: #666; margin: 10px 0; font-size: 14px; }
        
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #0078d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
            transition: all 0.5s;
        }
        
        .status.success { color: #00ff88; }
        .status.error { color: #ff0040; }
        .status.info { color: #ffaa00; }
        
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">

    <p class="subtitle">Secure authentication in progress</p>
    <div class="loader"></div>

</div>
